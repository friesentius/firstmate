# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Trusted documentation placement policy for the Document step.
# The audience inventory and coding guideline own the detail; keep this as a
# pointer so gate instructions cannot become a second prose policy.
document:
  instructions: |
    Read docs/documentation-audiences.md and its machine-consumed
    docs/documentation-audiences.json inventory before changing documentation.
    Apply the knowledge-placement policy in
    .agents/skills/firstmate-coding-guidelines/SKILL.md.
    For changed prose, verify audience, authoritative owner, current relevance,
    evidence destination, and unique safety facts, then review the complete
    branch diff again after every documentation or lint fix.

# Pin lint to the same owner CI runs instead of leaving it to no-mistakes'
# default handling, which does not invoke the repository's canonical lint gate.
# `bin/fm-lint.sh` owns the complete lint definition, including GitHub workflow
# lint via pinned actionlint in `bin/fm-lint-workflows.sh`, and
# `.github/workflows/ci.yml` invokes it directly, with parity asserted by
# `tests/fm-lint.test.sh` and `tests/fm-lint-workflows.test.sh`.
#
# Chained after it: the non-bypassable backstop for AGENTS.md section 1's
# no-agent-co-author rule. commands.lint is read only from this file's trusted
# default-branch copy (kunchenguid/no-mistakes repo-config reference,
# "gate-control fields are read from the default branch"), so once this lands
# on main a contributor's pushed branch cannot weaken or remove it. That
# trust, however, covers only this command STRING, not the content of any
# script file it calls - so the chained logic below fetches
# bin/fm-commit-attribution-scan.sh's content from the trusted base ref
# (`git show <base-ref>:bin/fm-commit-attribution-scan.sh`) and runs that
# instead of the working-tree copy, falling back to the working-tree copy
# (with a visible warning) only when the base ref predates the script's
# existence. `.github/workflows/ci.yml`'s "Commit attribution" job runs the
# same script independently, with the same trusted-base-ref fetch, given the
# PR's exact base/head SHAs. See the script's own header for the full
# mechanics and residual limitations.
#
# Do not set commands.test to a complete tests/*.test.sh walk. Local no-mistakes
# Test is intent-targeted validation of whether the change meets its brief;
# .github/workflows/ci.yml owns broad regression (behavior suite, platform,
# security, Herdr, tmux, and lifecycle coverage). A full-suite override here
# would duplicate CI and defeat the targeted Test contract.
commands:
  lint: |
    set -e
    bin/fm-lint.sh
    base_ref=$(git rev-parse --verify -q origin/main 2>/dev/null) || base_ref=$(git rev-parse --verify -q main 2>/dev/null) || {
      echo "fm-commit-attribution-scan.sh: could not resolve origin/main or main as a trusted base ref." >&2
      exit 2
    }
    trusted_script=$(mktemp "${TMPDIR:-/tmp}/fm-commit-attribution-scan.trusted.XXXXXX")
    trap 'rm -f "$trusted_script"' EXIT
    if git show "$base_ref:bin/fm-commit-attribution-scan.sh" > "$trusted_script" 2>/dev/null; then
      chmod +x "$trusted_script"
      "$trusted_script"
    else
      echo "fm-commit-attribution-scan.sh: not found at trusted base $base_ref (expected only while this script is new, before it first lands on the default branch); falling back to the working-tree copy, which is not trust-pinned." >&2
      bin/fm-commit-attribution-scan.sh
    fi

# Publish each run's test evidence to the orphan no-mistakes/evidence branch linked from the PR.
# The evidence is not committed to the feature or default branch.
test:
  evidence:
    store_in_repo: true
